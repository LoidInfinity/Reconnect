name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的标签名，例如 v0.1.0-beta.2"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Verify tag matches app_info.VERSION
        shell: pwsh
        run: |
          $source = Get-Content -Raw -Encoding UTF8 app_info.py
          if ($source -notmatch 'VERSION\s*=\s*"([^"]+)"') {
            throw "无法从 app_info.py 解析 VERSION"
          }
          $version = $Matches[1]
          $tag = $env:RELEASE_TAG -replace '^v', ''
          Write-Output "app_info.VERSION = $version"
          Write-Output "release tag      = $tag"
          if ($version -ne $tag) {
            throw "标签 $tag 与 app_info.VERSION $version 不一致，请先更新版本号再打标签"
          }

      - name: Run tests
        run: python -m unittest discover -p "test_*.py" -v

      - name: Build distribution
        run: python build.py

      - name: Show artifacts
        shell: pwsh
        run: Get-ChildItem dist -Filter "NetworkGuard-*" | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetworkGuard-windows-x64
          path: |
            dist/NetworkGuard-*-windows-x64.zip
            dist/NetworkGuard-*-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          body: |
            Windows x64 构建（预发行）。解压 `NetworkGuard-*-windows-x64.zip` 后运行 `NetworkGuard.exe`（图形界面）或 `start_cli.bat`（命令行模式）。

            校验下载文件：`Get-FileHash <zip 文件> -Algorithm SHA256`，与 `.sha256` 文件中的摘要比对。

            遇到问题请通过程序内「遇到问题」按钮打包日志，发送到 1164275580@qq.com。
          files: |
            dist/NetworkGuard-*-windows-x64.zip
            dist/NetworkGuard-*-windows-x64.zip.sha256
          fail_on_unmatched_files: true
