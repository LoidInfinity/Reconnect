name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的标签名，例如 v1.2.3-beta.1"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    env:
      # GitHub 的 Windows runner 默认控制台编码是 charmap，输出中文会抛
      # UnicodeEncodeError。强制 Python 使用 UTF-8 标准流。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --no-input --disable-pip-version-check -r requirements-build.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # windows-latest（Server 2025）不再预装 Inno Setup；
          # windows-2022 可能已自带，先检测再装，避免重复安装导致 choco 非零退出。
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 安装失败：找不到 $iscc" }
          Write-Output "ISCC: $iscc"

      - name: Verify tag matches app_info.VERSION
        shell: pwsh
        run: |
          $version = & python -c "import sys; sys.path.insert(0, 'src'); import app_info; print(app_info.VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "无法导入 app_info，请检查是否有语法错误" }
          $version = "$version".Trim()
          $tag = "$env:RELEASE_TAG".Trim() -replace '^v', ''
          Write-Output "app_info.VERSION = $version"
          Write-Output "release tag      = $tag"
          if ($version -ne $tag) {
            throw "标签 $tag 与 app_info.VERSION $version 不一致，请先更新版本号再打标签"
          }

      - name: Run tests
        env:
          # 无交互桌面的 runner 无法完成窗口布局，布局断言在 CI 上无意义
          SKIP_GUI_WINDOW_TESTS: "1"
        shell: pwsh
        run: |
          python -m unittest discover -s tests -t . -p "test_*.py" -v 2>&1 | Tee-Object -FilePath tests.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content tests.log -ErrorAction SilentlyContinue
            $selected = @($lines | Where-Object { $_ -match '^(FAIL|ERROR):|AssertionError|Error:|^FAILED' } | Select-Object -Last 8)
            if ($selected.Count -eq 0) {
              $selected = @($lines | Select-Object -Last 8)
            }
            foreach ($line in $selected) {
              $safe = "$line" -replace '%', '%25' -replace "`r", ''
              Write-Host "::error::$safe"
            }
            exit $code
          }
          Write-Host '全部测试通过'

      - name: Build distribution
        run: python src/build.py

      - name: Show artifacts
        shell: pwsh
        run: Get-ChildItem dist -Filter "NetworkGuard-*" | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetworkGuard-windows-x64
          path: |
            dist/NetworkGuard-*-windows-x64.zip
            dist/NetworkGuard-*-windows-x64.zip.sha256
            dist/NetworkGuard-Setup-*.exe
            dist/NetworkGuard-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          body: |
            Windows x64 构建（预发行）。

            - **安装版（推荐）**：`NetworkGuard-Setup-*.exe`，安装时可选安装目录，装完自动清除下载标记，不再弹「无法验证发布者」；卸载只删程序目录，`%LOCALAPPDATA%\NetworkGuard` 里的配置与日志保留。
            - **免安装版**：解压 `NetworkGuard-*-windows-x64.zip` 后运行 `NetworkGuard.exe`（图形界面）或 `start_cli.bat`（命令行模式）。

            > 免安装 ZIP 解压后若首次双击 `.bat` 提示「无法验证发布者」，那是 Windows 对网上下载文件的标记（`.bat` 无法代码签名）。双击包内 `unblock.bat` 即可清除；或右键 ZIP →「属性」→「解除锁定」后再解压。程序首次运行也会自动清理，详见包内 `READ-ME-FIRST.txt`。

            校验下载文件：`Get-FileHash <文件> -Algorithm SHA256`，与对应 `.sha256` 文件中的摘要比对。

            遇到问题请通过程序内「遇到问题」按钮打包日志，发送到 1164275580@qq.com。
          files: |
            dist/NetworkGuard-*-windows-x64.zip
            dist/NetworkGuard-*-windows-x64.zip.sha256
            dist/NetworkGuard-Setup-*.exe
            dist/NetworkGuard-Setup-*.exe.sha256
          fail_on_unmatched_files: true
